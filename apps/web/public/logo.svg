<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Background -->
    <radialGradient id="bgGlow" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#06281e" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#070a12" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030509" stop-opacity="1"/>
    </radialGradient>

    <!-- Emerald Spire 3D Gradient -->
    <linearGradient id="emeraldSpire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Platinum Metallic Sigma Gradient -->
    <linearGradient id="platinumMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Cyan Accent Rim -->
    <linearGradient id="cyanEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Specular Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="200" rx="24" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="636" height="196" rx="22" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- 3D Isometric Emblem Container -->
  <g transform="translate(42, 22)">
    <!-- Outer Hexagonal Glassmorphic Cage -->
    <polygon points="78,4 146,42 146,114 78,152 10,114 10,42" fill="#0b1324" fill-opacity="0.85" stroke="url(#cyanEdge)" stroke-width="1.5"/>
    <polygon points="78,12 138,46 138,110 78,144 18,110 18,46" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-dasharray="4 4"/>

    <!-- Ascending 3D Central Spire (Left & Right Facets) -->
    <polygon points="78,10 98,136 78,122" fill="url(#emeraldSpire)" filter="url(#neonGlow)"/>
    <polygon points="78,10 58,136 78,122" fill="#047857" opacity="0.9"/>

    <!-- Razor-Sharp Geometric Greek Sigma (Σ) Interlocked with Spire -->
    <path d="M 36,36 L 122,36 L 114,50 L 62,50 L 94,78 L 62,106 L 118,106 L 124,120 L 36,120 L 36,108 L 72,78 L 36,48 Z" 
          fill="url(#platinumMetal)" 
          stroke="#ffffff" 
          stroke-width="0.75"/>

    <!-- Glowing Apex Node -->
    <circle cx="78" cy="10" r="4" fill="#a7f3d0" filter="url(#neonGlow)"/>
  </g>

  <!-- Brand Wordmark & Tagline -->
  <g transform="translate(216, 88)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#ffffff">
      SIGMA<tspan fill="url(#emeraldSpire)">SPIRE</tspan>
    </text>
    <!-- Precision Sub-Rule -->
    <line x1="2" y1="18" x2="365" y2="18" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="195" cy="18" r="3" fill="#10b981"/>
    <text x="2" y="42" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="3.2" fill="#94a3b8">
      YOUR ALGORITHM • YOUR MANTRA • YOUR EDGE
    </text>
  </g>
</svg>
