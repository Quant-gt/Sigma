version: "3.8"

networks:
  quantra_internal:
    driver: bridge

services:
  redis:
    image: redis:7.2-alpine
    container_name: quantra_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - quantra_internal

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quantra_timescale
    restart: always
    environment:
      POSTGRES_DB: quantra_v2
      POSTGRES_USER: quantra_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - quantra_internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: quantra_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://quantra_admin:${POSTGRES_PASSWORD}@timescaledb:5432/quantra_v2
      - REDIS_URL=redis://redis:6379/0
      - QUANTRA_MASTER_KMS_KEY_HEX=${QUANTRA_MASTER_KMS_KEY_HEX}
      - CITADEL_HMAC_KEY=${CITADEL_HMAC_KEY}
    depends_on:
      - redis
      - timescaledb
    networks:
      - quantra_internal

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    container_name: quantra_engine
    restart: always
    environment:
      - DATABASE_URL=postgresql://quantra_admin:${POSTGRES_PASSWORD}@timescaledb:5432/quantra_v2
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - timescaledb
    networks:
      - quantra_internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quantra_web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://app.quantra.in
    depends_on:
      - api
    networks:
      - quantra_internal

  nginx:
    image: nginx:alpine
    container_name: quantra_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    networks:
      - quantra_internal

volumes:
  timescale_data:
