# infra/nginx/conf.d/quantra.conf
# ============================================================================
# 1. IP WHITELIST MAP FOR SIGMASPIRE CITADEL (SUPER ADMIN SUBDOMAIN)
# ============================================================================
geo $allowed_staff_vpn {
    default 0;
    # Whitelisted SigmaSpire Bengaluru HQ / WireGuard Bastion Egress IPs
    127.0.0.1 1;
    ::1 1;
    49.207.192.10 1;
    13.232.104.88 1;
}

# ============================================================================
# 2. PUBLIC SAAS INGRESS (app.quantra.in)
# ============================================================================
server {
    listen 80;
    server_name app.quantra.in quantra.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.quantra.in quantra.in;

    ssl_certificate /etc/letsencrypt/live/app.quantra.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.quantra.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        proxy_pass http://quantra_web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://quantra_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================================
# 3. CLOAKED SUPER ADMIN CITADEL INGRESS (citadel.sigmaspire.internal)
# ============================================================================
server {
    listen 443 ssl;
    server_name citadel.sigmaspire.internal;

    ssl_certificate /etc/letsencrypt/live/citadel.sigmaspire.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citadel.sigmaspire.internal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloak existence: if IP is not whitelisted, return fake 404 Not Found
    if ($allowed_staff_vpn = 0) {
        return 404;
    }

    location / {
        proxy_pass http://quantra_web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/citadel/ {
        proxy_pass http://quantra_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
