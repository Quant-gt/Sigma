[project]
name = "sigmaspire-engine"
version = "2.0.0"
description = "Institutional Algorithmic Trading & Strategy Automation SaaS for Indian Capital Markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "redis[hiredis]>=5.0.0",
    "cryptography>=43.0.0",
    "pyotp>=2.9.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
